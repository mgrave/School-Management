name: Deploy Docker to AWS - CICD

on:
  push:
    branches: [test]
    #paths:
      #- 'backend/**'  # Solo activa el flujo de trabajo si hay cambios en la carpeta 'backend'
env:
      NODE_ENV: production
      ORIGIN: ${{ vars.ORIGIN }}      

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Login to docker hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }} 
      - name: Build docker image
        run: |
          docker build -t htumba1105/school ./backend \
            --build-arg DOMAIN=${{ secrets.DOMAIN }} \
            --build-arg EMAIL=${{ secrets.EMAIL }} \
            --build-arg JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
            --build-arg AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }} \
            --build-arg AWS_REGION=${{ secrets.AWS_REGION }} \
            --build-arg AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --build-arg AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --build-arg AWS_FOLDER=${{ secrets.AWS_FOLDER }} \
            --build-arg PORT=${{ secrets.PORT }} \
            --build-arg DATABASE_URL=${{ secrets.DATABASE_URL }} \
            --build-arg ORIGIN=${{ secrets.ORIGIN }}
            
      - name: Publish image to docker hub
        run: docker push htumba1105/school:latest
        
  deploy:
    needs: build
    runs-on: [aws_ec2]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Stop docker-compose
        working-directory: ./backend
        run: sudo docker-compose down -v --remove-orphans 
      - name: Remove old school image
        run: |
          if sudo docker images -q htumba1105/school:latest; then
            sudo docker rmi htumba1105/school:latest
          fi
      - name: Pull new school image
        run: sudo docker pull htumba1105/school:latest
      - name: Full deployment
        working-directory: ./backend
        run: sudo docker-compose up -d