user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {

		# Upstream block to define the Node.js backend servers
		upstream nodejs_cluster {        
			server backend1:3000;
		}

		# Optional server block for HTTP to HTTPS redirection
		server {
			listen 80;  # Listen on port 80 for HTTP
			listen [::]:80;
			server_name api.nomadas.uk;
			server_tokens off;

			location /.well-known/acme-challenge/ {
				root /var/www/certbot;
			}

			# Redirect all HTTP traffic to HTTPS
			location / {
				#proxy_pass http://nodejs_cluster;
				#proxy_set_header Host $host;
				#proxy_set_header X-Real-IP $remote_addr;
				#proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				#proxy_set_header X-Forwarded-Proto $scheme;

				return 301 https://$host$request_uri;
			}
		}

		server {
			listen 443 ssl;
			server_name api.nomadas.uk;

			ssl_certificate /etc/letsencrypt/live/api.nomadas.uk/fullchain.pem;
			ssl_certificate_key /etc/letsencrypt/live/api.nomadas.uk/privkey.pem;

			location / {
                if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' 'https://schoolfrontend.vercel.app';
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                    add_header 'Access-Control-Allow-Credentials' 'true';
                    add_header 'Content-Length' 0;
                    add_header 'Content-Type' 'text/plain charset=UTF-8';
                    add_header 'Access-Control-Expose-Headers' 'Authorization, X-Custom-Header' always;  # Exponer encabezados específicos
                    return 204;
                }

                # Configuración del proxy
                proxy_ssl_server_name on;
                proxy_pass http://nodejs_cluster;
                proxy_read_timeout 90;
                proxy_connect_timeout 90;
                proxy_redirect off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;                
                proxy_set_header X-NginX-Proxy true;
                proxy_set_header Connection "";

                # Agregar encabezados CORS para solicitudes no OPTIONS
                if ($request_method !~ ^(OPTIONS)$) {
                    add_header 'Access-Control-Allow-Origin' 'https://schoolfrontend.vercel.app';
                    add_header 'Access-Control-Allow-Credentials' 'true';
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                    add_header 'Access-Control-Expose-Headers' 'Authorization, X-Custom-Header' always;  # Exponer encabezados específicos
                }
			}

			ssl_protocols TLSv1.2 TLSv1.3;
			ssl_prefer_server_ciphers on;
			ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
		}

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;

        ##
        # Gzip Settings
        ##

        gzip on;

        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##

        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;
}


