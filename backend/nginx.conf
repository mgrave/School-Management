worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
        
    # Upstream block to define the Node.js backend servers
    upstream nodejs_cluster {        
        server backend1:3000;
        server backend2:3000;
        server backend3:3000;
    }

    # Optional server block for HTTP to HTTPS redirection
    server {
        listen 80;  # Listen on port 80 for HTTP
        listen [::]:80;
        server_name nomadas.infy.uk;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP traffic to HTTPS
        location / {
            #proxy_pass http://nodejs_cluster;
            #proxy_set_header Host $host;
            #proxy_set_header X-Real-IP $remote_addr;
            #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            #proxy_set_header X-Forwarded-Proto $scheme;

            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name nomadas.infy.uk;

        ssl_certificate /etc/nginx/ssl/live/nomadas.infy.uk/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/nomadas.infy.uk/privkey.pem;

        location / {
            proxy_pass http://nodejs_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    }
    
}

