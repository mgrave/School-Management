services:
  nginx:
    #build:
       #context: .  # Usa el directorio actual como contexto de construcción
       #dockerfile: Dockerfile.nginx  # Especifica el Dockerfile unificado
    image: nginx:1.27-alpine    
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    restart: always
    depends_on:
      - backend1
      - certbot
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
    networks:
      - school-network
  
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www/:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    command: certonly --webroot -w /var/www/certbot --email ht@ht.com --agree-tos --no-eff-email --staging -d docker-compose run --rm certbot certonly --webroot --webroot-path /var/www/certbot/ --dry-run -d nomadas.infy.uk #--dry-run
    networks:
      - school-network      

  backend1:
    #build:
      #context: .  # Usa el directorio actual como contexto de construcción
      #dockerfile: Dockerfile  # Especifica el Dockerfile unificado
    image: htumba1105/school:latest
    environment: 
      - APP_NAME=backend1
    ports:
      - "3001:3000" 
    networks:
      - school-network 

networks:
  school-network:
    driver: bridge
    name: school-network