services:
  nginx:
    #build:
       #context: .  # Usa el directorio actual como contexto de construcción
       #dockerfile: Dockerfile.nginx  # Especifica el Dockerfile unificado
    image: nginx:1.27-alpine    
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    restart: always
    depends_on:
      - backend1
      - backend2
      - backend3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

  backend1:
    build:
      context: .  # Usa el directorio actual como contexto de construcción
      dockerfile: Dockerfile  # Especifica el Dockerfile unificado
    environment: 
      - APP_NAME=backend1
    ports:
      - "3001:3000" 
    networks:
      - app-network

  backend2:
    build:
      context: .  # Usa el directorio actual como contexto de construcción
      dockerfile: Dockerfile  # Especifica el Dockerfile unificado
    environment: 
      - APP_NAME=backend2
    ports:
      - "3002:3000" 
    networks:
      - app-network

  backend3:
    build:
      context: .  # Usa el directorio actual como contexto de construcción
      dockerfile: Dockerfile  # Especifica el Dockerfile unificado
    environment: 
      - APP_NAME=backend3
    ports:
      - "3003:3000" 
    networks:
      - app-network      

networks:
  app-network:
    driver: bridge
    name: app-network