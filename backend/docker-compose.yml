services:
  nginx:
    #build:
       #context: .  # Usa el directorio actual como contexto de construcción
       #dockerfile: Dockerfile.nginx  # Especifica el Dockerfile unificado
    image: nginx:1.27-alpine    
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - backend1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/:/etc/letsencrypt/
    networks:
      - school-network
    

  backend1:
    #build:
      #context: .  # Usa el directorio actual como contexto de construcción
      #dockerfile: Dockerfile  # Especifica el Dockerfile unificado
    image: htumba1105/school:latest
    environment:
      - APP_NAME=backend1
    secrets:
      - source: env_file
        target: .env
    ports:
      - "3001:3000" 
    networks:
      - school-network 

  backend2:
    #build:
      #context: .  # Usa el directorio actual como contexto de construcción
      #dockerfile: Dockerfile  # Especifica el Dockerfile unificado
    image: htumba1105/school:latest
    environment:
      - APP_NAME=backend2
    secrets:
      - source: env_file
        target: .env
    ports:
      - "3002:3000" 
    networks:
      - school-network 

  backend3:
    #build:
      #context: .  # Usa el directorio actual como contexto de construcción
      #dockerfile: Dockerfile  # Especifica el Dockerfile unificado
    image: htumba1105/school:latest
    environment:
      - APP_NAME=backend3
    secrets:
      - source: env_file
        target: .env
    ports:
      - "3003:3000" 
    networks:
      - school-network       

secrets:
  env_file:
    file: ./env_file

networks:
  school-network:
    driver: bridge
    name: school-network