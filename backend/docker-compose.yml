services:
  nginx:
    #build:
       #context: .  # Usa el directorio actual como contexto de construcción
       #dockerfile: Dockerfile.nginx  # Especifica el Dockerfile unificado
    image: nginx:1.27-alpine    
    ports:
      - "80:80"
      - "443:443"
    restart: always
    depends_on:
      - backend1
      - certbot
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/error.log:/etc/nginx/error_log.log
      - /etc/letsencrypt/:/etc/letsencrypt/
    networks:
      - school-network
    

  backend1:
    #build:
      #context: .  # Usa el directorio actual como contexto de construcción
      #dockerfile: Dockerfile  # Especifica el Dockerfile unificado
    image: htumba1105/school:latest
    environment: 
      - APP_NAME=backend1
    ports:
      - "3001:3000" 
    networks:
      - school-network 

networks:
  school-network:
    driver: bridge
    name: school-network